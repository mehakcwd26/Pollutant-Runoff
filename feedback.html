```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UpLinkAI Feedback Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8faff);
      color: #252642;
    }

    .container {
      max-width: 680px;
      margin: auto;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(40, 40, 90, 0.12);
    }

    .header {
      padding: 30px;
      color: white;
      background: linear-gradient(135deg, #4338ca, #7866f5);
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      line-height: 1.6;
    }

    form {
      padding: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .required {
      color: #dc2626;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d6d9e8;
      border-radius: 9px;
      background: white;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #5141d8;
      box-shadow: 0 0 0 3px rgba(81, 65, 216, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #5141d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #3f31b5;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }

    #status.success {
      background: #dcfce7;
      color: #166534;
    }

    #status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .footer {
      padding: 0 28px 25px;
      color: #71758a;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }

      .header {
        padding: 24px 20px;
      }

      form {
        padding: 22px 20px;
      }

      .footer {
        padding: 0 20px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>UpLinkAI Feedback Form</h1>
      <p>
        Your feedback matters! Help us improve our website,
        learning resources, and AI features.
      </p>
    </header>

    <form id="feedbackForm">

      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          maxlength="100"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          maxlength="254"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="course">Course / Department <span class="required">*</span></label>
        <input
          type="text"
          id="course"
          name="course"
          maxlength="150"
          placeholder="e.g. B.Tech CSE, BCA"
          required
        >
      </div>

      <div class="form-group">
        <label for="rating">Overall Rating <span class="required">*</span></label>
        <select id="rating" name="rating" required>
          <option value="">Select your rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Very Good</option>
          <option value="3">3 - Good</option>
          <option value="2">2 - Fair</option>
          <option value="1">1 - Needs Improvement</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Feedback Category <span class="required">*</span></label>
        <select id="category" name="category" required>
          <option value="">Select a category</option>
          <option value="Website">Website</option>
          <option value="Courses and Learning">Courses and Learning</option>
          <option value="AI Features">AI Features</option>
          <option value="User Experience">User Experience</option>
          <option value="Technical Issue">Technical Issue</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="feedback">Your Feedback <span class="required">*</span></label>
        <textarea
          id="feedback"
          name="feedback"
          maxlength="5000"
          placeholder="Share your experience with UpLinkAI..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="suggestions">Suggestions for Improvement</label>
        <textarea
          id="suggestions"
          name="suggestions"
          maxlength="5000"
          placeholder="What would you like us to improve?"
        ></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" type="submit">
        Submit Feedback
      </button>

      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      Fields marked with * are required. Submitted feedback will be
      stored in the connected Google Sheet.
    </div>

  </main>

  <script>
 " https://script.google.com/macros/s/AKfycbxHB1gsISpUmatZ79l30HXHoLuD1uzJoKqWV4OcOcHyy4S_4tVq5q5Cz_MsXK8ZQqI27A/exec";
    const form = document.getElementById("feedbackForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const data = {
        name: form.elements.namedItem("name").value.trim(),
        email: form.elements.namedItem("email").value.trim(),
        course: form.elements.namedItem("course").value.trim(),
        rating: form.elements.namedItem("rating").value,
        category: form.elements.namedItem("category").value,
        feedback: form.elements.namedItem("feedback").value.trim(),
        suggestions: form.elements.namedItem("suggestions").value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      statusBox.className = "";
      statusBox.textContent = "Saving your feedback...";

      // This works when the HTML is served by Google Apps Script.
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            form.reset();
            statusBox.textContent = result.message;
            statusBox.className = "success";
          } else {
            statusBox.textContent =
              "Submission could not be confirmed. Please try again.";
            statusBox.className = "error";
          }

          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Feedback";
        })
        .withFailureHandler(function(error) {
          statusBox.textContent =
            error && error.message
              ? error.message
              : "Something went wrong. Please try again.";
          statusBox.className = "error";

          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Feedback";
        })
        .submitFeedback(data);
    });
  </script>
</body>
</html>
